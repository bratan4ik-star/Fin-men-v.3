name: bella-app — тести й збірка APK

on:
  push:
    branches: ["main"]
    paths: ["bella-app/**", ".github/workflows/bella-app.yml"]
  pull_request:
    paths: ["bella-app/**", ".github/workflows/bella-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bella-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bella-app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # повна історія: номер збірки = кількість комітів

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Кеш Gradle між запусками: залежності й сам дистрибутив Gradle wrapper (~/.gradle/wrapper/dists),
      # щоб збій завантаження з services.gradle.org (504) не зупиняв збірку. Пишуть кеш main і ручні запуски,
      # PR лише читають. Gradle wrapper JAR перевіряється на справжність (validate-wrappers, за замовчуванням).
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # відкритий кеш на actions/cache, без пропрієтарного компонента
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper/dists

      # Тести й debug-APK одним запуском Gradle: один старт JVM і одна конфігурація проєкту.
      # scripts/gradlew-retry.sh повторює запуск до 3 разів (пауза 30–60 с) лише при мережевому збої
      # (завантаження Gradle чи залежностей: 5xx, тайм-аут); падіння тестів і компіляції не повторюються.
      - name: Юніт-тести й debug-APK
        run: scripts/gradlew-retry.sh --no-daemon :app:testDebugUnitTest :app:assembleDebug


      # Підписаний release збирається, лише коли задано секрети BELLA_KEYSTORE_BASE64, BELLA_STORE_PASSWORD, BELLA_KEY_ALIAS
      # (і за потреби BELLA_KEY_PASSWORD). Без них цей крок пропускається.
      # Лише для main і ручного запуску: у PR достатньо тестів і debug-APK, release-збірка займає ще кілька хвилин.
      - name: Release-APK (підписаний)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.BELLA_KEYSTORE_BASE64 }}
          BELLA_STORE_PASSWORD: ${{ secrets.BELLA_STORE_PASSWORD }}
          BELLA_KEY_ALIAS: ${{ secrets.BELLA_KEY_ALIAS }}
          BELLA_KEY_PASSWORD: ${{ secrets.BELLA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Секрети підпису не задано, release пропущено"; exit 0; fi
          # ключ видаляється й тоді, коли збірка впала
          trap 'rm -f "$RUNNER_TEMP/bella-release.jks"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bella-release.jks"
          BELLA_KEYSTORE="$RUNNER_TEMP/bella-release.jks" scripts/gradlew-retry.sh --no-daemon :app:assembleRelease

      - name: Завантажити APK
        uses: actions/upload-artifact@v7
        with:
          name: bella-app-apk
          path: |
            bella-app/app/build/outputs/apk/debug/*.apk
            bella-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Знімки екранів на демо-даних (ScreenshotTest, Robolectric): видно, як виглядає кожен екран, без телефону
      - name: Знімки екранів
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bella-app-screenshots
          path: bella-app/app/build/screenshots/
          if-no-files-found: warn

      - name: Звіт тестів
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bella-app-test-report
          path: bella-app/app/build/reports/tests/
          if-no-files-found: ignore
